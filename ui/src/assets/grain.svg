<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">
  <!--
    Film grain. One file, reused by every aurora surface and glass card at
    varying opacity (.2-.3) with mix-blend-mode: overlay.

    The mocks inlined this as a data-URI four times with baseFrequency .8-.9;
    at overlay blend and <=.3 opacity those are indistinguishable, so the
    handoff's suggestion to consolidate is taken and .85 is the one value.
  -->
  <filter id="n">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" />
  </filter>
  <rect width="160" height="160" filter="url(#n)" />
</svg>
